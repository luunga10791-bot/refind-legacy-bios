name: Build rEFInd Legacy BIOS boot sectors

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm make

      - name: Build vendored Clover boot sectors
        working-directory: vendor/clover-bootsector
        run: bash ./build.sh

      - name: Assemble release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/packages dist/complete/payloads/BootSectors dist/complete/installers
          cp vendor/clover-bootsector/build/* dist/complete/payloads/BootSectors/
          cp -R vendor/clover-bootsector dist/complete/source
          cp installers/windows/install.bat installers/windows/install.ps1 dist/complete/installers/
          cp installers/linux/install.sh dist/complete/installers/
          cp installers/windows/install.bat dist/packages/install-windows.bat
          cp installers/windows/install.ps1 dist/packages/install-windows.ps1
          cp installers/linux/install.sh dist/packages/install-linux.sh
          cat > dist/complete/README-INSTALLATION.txt <<'EOF'
          Clover-derived MBR/FAT32 boot-sector components built from source in this repository.
          No Clover DUET boot6/boot7 and no rEFInd EFI binary are included.
          The Windows/Linux installer entry points are currently read-only safety previews.
          MBR boot code and FAT32 PBR must be installed only after validating the target layout.
          Preserve the original MBR partition table and the FAT32 BPB. Do not format the disk.
          GPT legacy BIOS boot support depends on the exact partition layout and BIOS; test first.
          EOF
          tar -czf dist/packages/refind-legacy-bios-bootsectors.tar.gz -C dist complete
          (cd dist/packages && sha256sum * > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: refind-legacy-bios-bootsectors-${{ github.sha }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/packages/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
