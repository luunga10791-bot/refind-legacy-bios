name: Build rEFInd Legacy BIOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4

      - name: Validate repository-local payloads
        shell: bash
        run: |
          set -euo pipefail
          required=(
            payloads/DUET/boot6/boot
            payloads/DUET/boot7/boot
            payloads/BootSectors/boot0ss
            payloads/BootSectors/boot1f32
          )
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing repository payload: $file"
              exit 1
            fi
          done

      - name: Assemble release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/packages dist/complete
          cp -R payloads dist/complete/
          mkdir -p dist/complete/installers
          cp installers/windows/install.bat installers/windows/install.ps1 dist/complete/installers/
          cp installers/linux/install.sh dist/complete/installers/
          cat > dist/complete/README-INSTALLATION.txt <<'EOF'
          Repository-local experimental boot payloads and disk-selection installers.
          No rEFInd EFI binary is included. Download rEFInd separately and place
          refind_x64.efi at EFI/BOOT/BOOTX64.EFI on the EFI System Partition.
          The installer scripts validate and back up before any raw-sector write.
          MBR and GPT require different layouts; a payload alone does not guarantee
          legacy BIOS boot on GPT. Test with disposable media first.
          EOF
          cp installers/windows/install.bat dist/packages/install-windows.bat
          cp installers/windows/install.ps1 dist/packages/install-windows.ps1
          cp installers/linux/install.sh dist/packages/install-linux.sh
          tar -czf dist/packages/refind-legacy-bios-payloads.tar.gz -C dist complete
          (cd dist/packages && sha256sum * > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: refind-legacy-bios-${{ github.sha }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/packages/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
