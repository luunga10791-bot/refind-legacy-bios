name: Build rEFInd Legacy BIOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Install NASM
        run: brew install nasm

      - name: Checkout CloverBootloader
        uses: actions/checkout@v4
        with:
          repository: CloverHackyColor/CloverBootloader
          ref: master
          path: upstream/CloverBootloader
          submodules: recursive
          fetch-depth: 0

      # Clover's own CI entry point calls makeRelease(), which builds boot7
      # with -mc and then boot6 without -mc, and runs the packaging steps.
      - name: Build Clover DUET boot6 and boot7
        working-directory: upstream/CloverBootloader
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./buildme ./ebuild.sh ./hebuild.sh
          ./buildme "" ci

      - name: Download rEFInd binary distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/staging/refind
          curl --fail --location --retry 3 \
            https://sourceforge.net/projects/refind/files/latest/download \
            --output /tmp/refind-bin.zip
          ditto -x -k /tmp/refind-bin.zip dist/staging/refind
          REFIND_EFI="$(find dist/staging/refind -type f -iname 'refind_x64.efi' -print -quit)"
          test -n "$REFIND_EFI"
          REFIND_DIR="$(dirname "$REFIND_EFI")"
          mkdir -p dist/EFI/BOOT
          cp "$REFIND_EFI" dist/EFI/BOOT/BOOTX64.EFI
          if [ -d "$REFIND_DIR/drivers_x64" ]; then
            cp -R "$REFIND_DIR/drivers_x64" dist/EFI/BOOT/
          fi
          if [ -d "$REFIND_DIR/icons" ]; then
            cp -R "$REFIND_DIR/icons" dist/EFI/BOOT/
          fi
          if [ -f "$REFIND_DIR/refind.conf-sample" ]; then
            cp "$REFIND_DIR/refind.conf-sample" dist/EFI/BOOT/refind.conf
          fi

      - name: Collect Clover bootloaders and boot-sector components
        working-directory: upstream/CloverBootloader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../dist/DUET/boot6 ../../dist/DUET/boot7 ../../dist/BootSectors
          PKG_DIR="$PWD/CloverPackage"
          test -d "$PKG_DIR"
          BOOT6="$(find "$PKG_DIR" -type f -path '*/Bootloaders/x64/boot6' -print -quit)"
          BOOT7="$(find "$PKG_DIR" -type f -path '*/Bootloaders/x64/boot7' -print -quit)"
          test -n "$BOOT6"
          test -n "$BOOT7"
          cp "$BOOT6" ../../dist/DUET/boot6/boot
          cp "$BOOT7" ../../dist/DUET/boot7/boot
          BOOTSECTORS="$(find "$PKG_DIR" -type d -name BootSectors -print -quit)"
          test -n "$BOOTSECTORS"
          cp "$BOOTSECTORS"/boot* ../../dist/BootSectors/
          for f in Description.txt Installation.txt; do
            [ ! -f "$BOOTSECTORS/$f" ] || cp "$BOOTSECTORS/$f" ../../dist/BootSectors/
          done

      - name: Write package notes and archives
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/README-INSTALLATION.txt <<'EOF'
          Experimental payload package only; no automatic disk installer is provided.
          DUET boot6 and boot7 are separate alternatives, not files to rename interchangeably.
          Boot-sector files are upstream Clover components. Their presence does not certify
          a particular MBR/GPT layout. boot1f32 is a FAT32 partition boot sector.
          Back up sectors before manual installation. Preserve the MBR partition table and
          preserve the FAT32 BPB when replacing a FAT32 PBR. Never write a whole 512-byte
          sector blindly to a physical disk.
          rEFInd is staged as EFI/BOOT/BOOTX64.EFI for the EFI application stage.
          Validate on a disposable disk image and in a BIOS virtual machine before use.
          EOF
          mkdir -p dist/packages
          ditto -c -k --sequesterRsrc dist/EFI dist/packages/refind-efi-x64.zip
          ditto -c -k --sequesterRsrc dist/DUET/boot6 dist/packages/duet-boot6.zip
          ditto -c -k --sequesterRsrc dist/DUET/boot7 dist/packages/duet-boot7.zip
          ditto -c -k --sequesterRsrc dist/BootSectors dist/packages/clover-bootsector-components.zip
          ditto -c -k --sequesterRsrc dist dist/packages/refind-legacy-bios-complete.zip
          shasum -a 256 dist/packages/*.zip > dist/packages/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: refind-legacy-bios-${{ github.sha }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/packages/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
